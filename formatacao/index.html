<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programa de Mercado</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Programa de Mercado</h1>
        <div class="form-group">
            <label for="item">Item:</label>
            <input type="text" id="item" placeholder="Nome do item">
            <label for="price">Preço:</label>
            <input type="number" id="price" placeholder="Preço do item">
            <button id="addItemBtn">Adicionar Item</button>
        </div>
        <div class="cart">
            <h2>Carrinho</h2>
            <ul id="cartItems"></ul>
            <h3>Total: R$<span id="totalPrice">0.00</span></h3>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
